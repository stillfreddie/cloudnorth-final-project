apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cloudnorth-backend
      color: {{ .Values.color }}
  template:
    metadata:
      labels:
        app: cloudnorth-backend
        color: {{ .Values.color }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
